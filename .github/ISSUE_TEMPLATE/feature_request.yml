name: Feature request
description: Propose a change or addition to Loklekha.
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Loklekha builds on pardarsh-core. App workflows, UI, moderation and accounts belong here;
        changes to the shared record model belong in pardarsh-core.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve, and for whom (residents, institutions, moderators, researchers)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: dropdown
    id: core_impact
    attributes:
      label: Does this need a pardarsh-core change?
      options:
        - "No, it fits in Loklekha's extensions"
        - "Yes, it needs a change in pardarsh-core"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and neutrality considerations
      description: Could this expose personal data, imply verification that has not happened, or favour a viewpoint?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
