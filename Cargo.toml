[package]
name = "loklekha"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Loklekha: a public civic issue ledger built on pardarsh-core."
license = "MIT"
publish = false

[dependencies]
pardarsh-core = { path = "pardarsh-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
