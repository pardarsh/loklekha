[package]
name = "loklekha"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Loklekha: a public civic issue ledger built on pardarsh-core."
license = "MIT"
publish = false

[dependencies]
pardarsh-core = { path = "pardarsh-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = [
    "std",
    "clock",
    "serde",
] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "time",
] }
axum-login = "0.18"
tower-sessions-rusqlite-store = "~0.14.1"
password-auth = "1"
askama = "0.14.0"
axum_csrf = "0.11"
askama_web = { version = "0.14", features = ["axum-0.8"] }
tower-sessions = "0.14"
rusqlite = "0.37"
tokio-rusqlite = "0.7"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["sync"] }
