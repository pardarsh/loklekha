[package]
name = "loklekha"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Loklekha: a public civic issue ledger built on pardarsh-core."
license = "MIT"
publish = false

[dependencies]
pardarsh-core = { path = "pardarsh-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
